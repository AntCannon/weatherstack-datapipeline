services:
  db:
    container_name: postgres_container
    image: postgres:18.6
    ports:
      - "4000:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d db"]
      interval: 5s
      timeout: 5s
      retries: 20


  airflow-db-setup:
    image: postgres:18.6
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: db_user
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PGDATABASE: db
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
    volumes:
      - ./setup/init-airflow-db.sql:/setup/init-airflow-db.sql:ro
    command:
      - psql
      - --no-psqlrc
      - --set=ON_ERROR_STOP=1
      - --file=/setup/init-airflow-db.sql


  af:
    container_name: airflow_container
    image: apache/airflow:3.3.2-python3.12
    command: standalone
    ports:
      - 4040:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@db:5432/airflowdb
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: db
      DB_USER: db_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      API_KEY: ${API_KEY:?Set API_KEY}
    depends_on:
      airflow-db-setup:
        condition: service_completed_successfully
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - ./api_request.py:/opt/airflow/pipeline/api-requests/api_request.py:ro
      - ./insert_records.py:/opt/airflow/pipeline/api-requests/insert_records.py:ro
      - ../data:/opt/airflow/pipeline/data:ro


volumes:
  postgres_data:
  airflow_logs:

